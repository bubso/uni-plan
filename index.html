<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road to a UK science degree: 2028 entry tracker</title>
<meta name="apple-mobile-web-app-title" content="Uni plan">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBFCFE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1528" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style id="css">
:root{
  --paper:#FBFCFE; --ink:#1A2340; --ink2:#4E5980; --rule:#DFE5F5; --rule2:#BAC5EA;
  --margin:#D63A4F; --pen:#2B45C9; --ok:#2B7A55; --warn:#AE4F14; --chip:#EEF1FB;
  --mcol:104px;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1528; --ink:#E7EBF7; --ink2:#A6B0CF; --rule:#1C2644; --rule2:#2B3965;
    --margin:#FF6C7D; --pen:#97ABFF; --ok:#6FCB9C; --warn:#F2A66E; --chip:#18213D;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1528; --ink:#E7EBF7; --ink2:#A6B0CF; --rule:#1C2644; --rule2:#2B3965;
  --margin:#FF6C7D; --pen:#97ABFF; --ok:#6FCB9C; --warn:#F2A66E; --chip:#18213D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--pen)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:3px}

.seyes{
  background-color:var(--paper);
  background-image:
    linear-gradient(to bottom, var(--rule2) 1px, transparent 1px),
    linear-gradient(to bottom, var(--rule) 1px, transparent 1px),
    linear-gradient(to right, var(--rule) 1px, transparent 1px);
  background-size:100% 32px, 100% 8px, 32px 100%;
}

.wrap{max-width:1000px;margin:0 auto;position:relative}
.sheet{position:relative;padding:0 20px 0 0}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:var(--mcol);width:2px;background:var(--margin);opacity:.8;pointer-events:none}

header.hero{border-bottom:1px solid var(--rule2)}
.hero .sheet{padding-top:40px;padding-bottom:28px}
.hero-grid{display:grid;grid-template-columns:var(--mcol) 1fr;align-items:start}
.hero .who{grid-column:2;padding-left:22px}
.kicker{font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--ink2);margin:0 0 6px}
.count{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.count .n{font-family:var(--display);font-weight:800;font-size:clamp(5rem,16vw,9.5rem);line-height:.86;letter-spacing:-.04em;color:var(--pen)}
.count .lab{font-family:var(--display);font-size:clamp(1.15rem,2.6vw,1.6rem);font-weight:600;max-width:24ch;line-height:1.2}
.hero p.sub{max-width:62ch;margin:14px 0 0;color:var(--ink2)}
.hero .sidecount{grid-column:1;text-align:right;padding-right:14px;padding-top:10px;font-family:var(--display);color:var(--margin);font-weight:600;font-size:.95rem;line-height:1.2}
.nextup{margin:22px 0 0;padding:0;list-style:none;max-width:66ch}
.nextup li{display:flex;gap:12px;padding:3px 0}
.nextup .d{min-width:7.5em;color:var(--margin);font-weight:700;font-variant-numeric:tabular-nums}
.progress{margin-top:20px;display:flex;align-items:center;gap:12px;max-width:520px}
.bar{flex:1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);width:0;transition:width .4s ease}
.status{font-size:.85rem;color:var(--ink2);min-height:1.3em;margin-top:8px}

nav.tabs{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule2)}
nav.tabs .sheet{display:flex;gap:4px;overflow-x:auto;padding-left:calc(var(--mcol) + 14px);scrollbar-width:none}
nav.tabs .sheet::before{display:none}
nav.tabs button{background:none;border:0;padding:14px 12px 12px;font-family:var(--display);font-weight:600;font-size:1rem;color:var(--ink2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen)}

main .sheet{padding-top:18px;padding-bottom:60px}
.panel[hidden],.note[hidden]{display:none}
.intro{margin:0 0 14px calc(var(--mcol) + 22px);max-width:68ch;color:var(--ink2)}
.intro strong{color:var(--ink)}

.toolbar{margin:0 0 10px calc(var(--mcol) + 22px);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--rule2);background:transparent;border-radius:999px;padding:4px 12px;font-size:.88rem;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--chip);color:var(--ink);border-color:var(--pen)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.toggle{font-size:.88rem;color:var(--ink2);display:flex;gap:6px;align-items:center;margin-left:6px}

.legend{margin:0 0 18px calc(var(--mcol) + 22px);font-size:.85rem;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px 14px}

ol.timeline{list-style:none;margin:0;padding:0}
.month{display:grid;grid-template-columns:var(--mcol) 1fr;margin-top:26px}
.month h3{grid-column:2;margin:0;padding:0 0 6px 22px;font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.01em;border-bottom:1px solid var(--rule2)}
.month h3 small{font-family:var(--body);font-weight:400;font-size:.9rem;color:var(--ink2);margin-left:10px}
.row{display:grid;grid-template-columns:var(--mcol) 1fr;border-bottom:1px solid var(--rule)}
.row .mg{text-align:right;padding:12px 14px 10px 0;font-family:var(--display);line-height:1.05}
.row .mg .day{display:block;font-weight:800;font-size:1.55rem;color:var(--ink)}
.row .mg .wd{display:block;font-size:.8rem;color:var(--ink2);margin-top:2px}
.row .mg .approx{display:block;font-weight:600;font-size:.82rem;color:var(--ink2);line-height:1.25}
.row .bd{padding:12px 0 12px 22px;min-width:0}
.row label.ttl{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:700;font-size:1.03rem}
.row label.ttl input{margin-top:5px;width:18px;height:18px;flex:0 0 auto;accent-color:var(--pen)}
.row .x{margin:4px 0 6px 28px;max-width:70ch;color:var(--ink)}
.row .meta{margin-left:28px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.82rem;color:var(--ink2)}
.row.done .ttl span{text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:2px;color:var(--ink2)}
.row.done .x{color:var(--ink2)}
.row.overdue .mg .day,.row.overdue .mg .approx{color:var(--warn)}
.row.next{background:linear-gradient(to right, transparent var(--mcol), color-mix(in srgb, var(--pen) 7%, transparent) var(--mcol))}
.row.next .mg .day{color:var(--pen)}
.row.today-line{border-top:2px dashed var(--margin)}
.tag{border:1px solid currentColor;border-radius:4px;padding:0 6px;font-size:.76rem;line-height:1.5}
.tag.confirmed{color:var(--ok)}
.tag.projected{color:var(--pen);border-style:dashed}
.tag.check{color:var(--warn)}
.tag.idea,.tag.mine{color:var(--ink2)}
.tag.listed{color:var(--ok);border-style:dotted}
.catname::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c,#888);vertical-align:0}
.linkbtn{background:none;border:0;padding:0;color:var(--pen);cursor:pointer;font-size:.82rem;text-decoration:underline}
.note{margin:8px 0 0 28px;display:flex;gap:8px;max-width:62ch}
.note input{flex:1;border:1px solid var(--rule2);background:var(--paper);border-radius:6px;padding:6px 10px;min-width:0}
.note-text{margin:6px 0 0 28px;font-style:italic;color:var(--ink2);max-width:66ch}
.note-text::before{content:"Note: ";font-style:normal;font-weight:700}

.add{display:grid;grid-template-columns:var(--mcol) 1fr;margin-top:32px}
.add form{grid-column:2;padding-left:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.add h4{grid-column:2;margin:0 0 8px;padding-left:22px;font-family:var(--display);font-size:1.15rem}
.add label{display:flex;flex-direction:column;font-size:.8rem;color:var(--ink2);gap:3px}
.add input,.add select{border:1px solid var(--rule2);background:var(--paper);border-radius:6px;padding:7px 10px}
.add input[name=t]{min-width:min(340px,70vw)}
.btn{background:var(--pen);color:var(--paper);border:0;border-radius:6px;padding:8px 16px;font-weight:700;cursor:pointer}

/* ruled blocks for reference tabs */
.block{display:grid;grid-template-columns:var(--mcol) 1fr;border-bottom:1px solid var(--rule)}
.block .mg{text-align:right;padding:16px 14px 0 0;font-family:var(--display);font-weight:800;font-size:.9rem;line-height:1.15;color:var(--margin);overflow-wrap:normal}
.block .bd{padding:14px 0 16px 22px;min-width:0}
.block h3{margin:0 0 6px;font-family:var(--display);font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.block dl{margin:0;display:grid;grid-template-columns:9.5em 1fr;gap:6px 16px;max-width:820px}
.block dt{font-weight:700;color:var(--ink2);font-size:.9rem;padding-top:1px}
.block dd{margin:0}
.block p{margin:0 0 8px;max-width:72ch}
.block ul{margin:4px 0 8px;padding-left:1.1em;max-width:72ch}
.block li{margin:3px 0}
.block .src{font-size:.82rem;margin-top:6px}
.block.warnblock .mg{color:var(--warn)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 26px;margin-top:6px}
.ideas h4{margin:12px 0 4px;font-family:var(--display);font-size:1.05rem}
.ideas p{margin:0;font-size:.95rem}
.ideas .shows{color:var(--ink2);font-size:.85rem;font-style:italic;margin-top:2px}
ol.decisions{counter-reset:dec;list-style:none;margin:0;padding:0}

footer .sheet{padding:24px 20px 50px calc(var(--mcol) + 22px);font-size:.85rem;color:var(--ink2);border-top:1px solid var(--rule2)}
footer .sheet::before{display:none}
footer p{max-width:72ch;margin:0 0 8px}

@media (max-width:640px){
  :root{--mcol:62px}
  .sheet{padding-right:12px}
  .row .mg .day{font-size:1.25rem}
  .row .mg{padding-right:9px}
  .row .bd,.block .bd{padding-left:14px}
  .row .x,.row .meta,.note,.note-text{margin-left:0}
  .block .mg{font-size:.8rem;padding-right:8px}
  .block dl{grid-template-columns:1fr;gap:0 0}
  .block dd{margin-bottom:8px}
  .hero .who,.intro,.toolbar,.legend{padding-left:0;margin-left:calc(var(--mcol) + 14px)}
  .hero .who{margin-left:0;padding-left:14px}
  .month h3{padding-left:14px;font-size:1.25rem}
  .add form,.add h4{padding-left:14px}
  nav.tabs .sheet{padding-left:8px}
  .hero .sidecount{font-size:.75rem;padding-right:8px}
}
@media (prefers-reduced-motion: reduce){ .bar span{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<script id="state" type="application/json">{"done":{},"notes":{},"custom":[]}</script>
<script id="main">
(function(){
"use strict";
var HEAD = '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Road to a UK science degree: 2028 entry tracker</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">\n';

var CATS = {
  school:{n:"Lycée & bac", c:"#C2410C"},
  tests:{n:"Admissions tests", c:"#7C3AED"},
  ucas:{n:"Application", c:"#2B45C9"},
  visits:{n:"Open days", c:"#0E8A6A"},
  stretch:{n:"Beyond the syllabus", c:"#B4237A"},
  admin:{n:"Admin & money", c:"#6B7280"}
};
var CONF = {
  confirmed:"Confirmed date",
  listed:"Published (re-check)",
  projected:"Projected from last cycle",
  check:"Ask the school",
  idea:"Suggested step",
  mine:"Your item"
};

var U_UCAS="https://www.ucas.com/discover/advice-for-parents-guardians-and-carers/key-dates-and-the-application-journey";
var U_UAT="https://esat-tmua.ac.uk/deadlines/";
var U_BAC="https://www.letudiant.fr/bac/date-du-bac.html";
var U_OD="https://www.etonecollege.co.uk/wp-content/uploads/2026/05/University-Open-Days-Letter-ASA-Apr2026-1.pdf";
var U_CAMOD="https://www.christs.cam.ac.uk/admissions/open-days-prospective-applicants/cambridge-open-days";
var U_CAMD="https://www.magd.cam.ac.uk/undergraduate/apply/dates-and-deadlines";

var ITEMS = [
 {id:"a01",d:"2026-10-16",ap:"This month",cat:"school",cf:"check",t:"Meet the Lycée's UK university advisers",x:"Ask four things: the internal UCAS deadline for Oxford/Cambridge (schools set one well before 15 Oct), how predicted grades are set from 1ère and Terminale T1 bulletins, who writes the reference, and whether the Lycée enters students for UKMT, BPhO and the British Informatics Olympiad."},
 {id:"a02",d:"2026-10-07",cat:"stretch",cf:"confirmed",t:"UKMT Senior Maths Challenge 2026 (already held)",x:"It ran on Wed 7 Oct 2026, so this year's chance has gone unless the Lycée entered him. Use the 2026 paper as a timed 90-minute benchmark at home instead, and ask the Lycée to enter him in October 2027.",u:"https://ukmt.org.uk/senior-challenges/senior-mathematical-challenge"},
 {id:"a03",d:"2026-10-24",cat:"visits",cf:"listed",t:"Warwick open day",x:"A low-pressure first look while still in 1ère. Maths and Computer Science are the headline science courses there.",u:U_OD},
 {id:"a04",d:"2026-10-24",cat:"visits",cf:"listed",t:"Edinburgh open day (same day as Warwick)",x:"Only worth the trip if Scotland is genuinely on the list: Scottish degrees usually take four years.",u:U_OD},
 {id:"a05",d:"2026-10-31",cat:"visits",cf:"listed",t:"Bristol open day",x:"Strong physics, maths and CS. Entry requirements for the French bac not checked yet.",u:U_OD},
 {id:"a06",d:"2026-11-01",cat:"stretch",cf:"idea",t:"Start a curiosity log",x:"One running document: every book, lecture, problem set, competition and project, with a line on what he learned or disagreed with. This becomes the raw material for the personal statement and interviews."},
 {id:"a07",d:"2026-11-14",cat:"visits",cf:"listed",t:"Birmingham open day",x:"Useful as a realistic 'safer' option to see in person.",u:U_OD},
 {id:"a08",d:"2026-11-16",cat:"visits",cf:"listed",t:"Manchester virtual mini open days (16–20 Nov)",x:"Manchester Physics asks 17 overall with 17 in Physique-chimie and 17 in Maths.",u:U_OD},
 {id:"a09",d:"2026-11-18",ap:"Nov 2026, TBC",cat:"stretch",cf:"projected",t:"British Mathematical Olympiad, round 1 (if qualified or entered)",x:"Top Senior Maths Challenge scorers are invited; schools can also enter students directly.",u:"https://bmos.ukmt.org.uk/home/calendar.shtml"},
 {id:"a10",d:"2026-12-07",ap:"Dec 2026 – Jan 2027",cat:"stretch",cf:"projected",t:"British Informatics Olympiad, round 1",x:"Free 3-hour programming paper sat at school on any day in the window (last year: 8 Dec – 23 Jan). The school registers. Ideal if CS is in the frame.",u:"https://www.olympiad.org.uk"},
 {id:"a11",d:"2026-12-14",ap:"Mid-Dec 2026",cat:"school",cf:"check",t:"Conseil de classe, trimestre 1",x:"These marks will appear on the school transcript Cambridge asks French-bac applicants for, and they're the main school record the Lycée will have when it writes predicted grades in autumn 2027 (ask how it sets them). The top offers sit at 16.5–17+ overall with 16–17+ in maths and physics."},
 {id:"a12",d:"2026-12-21",cat:"tests",cf:"idea",t:"Diagnostic: one TMUA paper and one ESAT paper, untimed",x:"Past papers are free on the UAT-UK site. Both are no-calculator, which feels odd after French maths. See which style suits him before choosing a course.",u:"https://esat-tmua.ac.uk/"},
 {id:"a13",d:"2027-01-11",ap:"Jan 2027",cat:"stretch",cf:"projected",t:"PROMYS Europe applications open",x:"Six-week maths summer programme at Oxford for students aged 16+ resident in Europe; needs a hard problem set plus a teacher reference. The 2026 deadline was 26 January.",u:"https://www.maths.ox.ac.uk/node/26351"},
 {id:"a14",d:"2027-01-31",ap:"By end Jan 2027",cat:"ucas",cf:"idea",t:"Pick the subject",x:"Maths, Physics, Computer Science, Maths & CS, Natural Sciences or Engineering. This choice decides the Terminale spécialités, the admissions test and what the personal statement is about. One UCAS statement covers all five choices, so the five should be the same or very close subjects."},
 {id:"a15",d:"2027-02-15",ap:"Feb–Mar 2027, school date TBC",cat:"school",cf:"check",t:"Choose Terminale spécialités and take Maths expertes",x:"Physics, Natural Sciences or Engineering: keep Maths + Physique-chimie. Computer Science: Maths + NSI is common, but check each course. Either way take Maths expertes: Imperial requires it for reformed-bac applicants, and Cambridge warns the plain bac is lighter than A-level Further Maths."},
 {id:"a16a",d:"2027-01-18",ap:"18–22 Jan 2027",cat:"stretch",cf:"confirmed",t:"BPhO Senior Physics Challenge, online quiz",x:"Two 30-minute sections, sat in school under a teacher. Entry is only through a registered teacher: students can't enter themselves. £20 covers the whole school.",u:"https://www.bpho.org.uk/bpho/as-challenge.html"},
 {id:"a16",d:"2027-03-05",cat:"stretch",cf:"confirmed",t:"BPhO Senior Physics Challenge, paper competition",x:"One hour, teacher-invigilated in school. Same rule: a teacher at the Lycée has to register the school. Ask a physics teacher well before January.",u:"https://www.bpho.org.uk/bpho/as-challenge.html"},
 {id:"a17",d:"2027-03-15",cat:"admin",cf:"check",t:"Confirm fee status: Home or International",x:"This decides the tuition fee band, and the gap between the two is very large. It depends on nationality, residence history and immigration status, and each university assesses it. Check UKCISA's fee-status guidance early.",u:"https://www.ukcisa.org.uk"},
 {id:"a18",d:"2027-03-31",cat:"admin",cf:"check",t:"Confirm English-language evidence for each shortlisted course",x:"Options include a GCSE/IGCSE English grade, the BFI/OIB, or an IELTS-type test. Imperial, for example, accepts GCSE English Language at grade 6. Book a test now if one is needed.",u:"https://www.imperial.ac.uk/study/apply/english-language"},
 {id:"a19",d:"2027-04-15",ap:"Spring 2027",cat:"visits",cf:"confirmed",t:"Book Cambridge Open Days",x:"Booking is required and opens in spring 2027 for the 8–9 July days.",u:U_CAMOD},
 {id:"a20",d:"2027-04-30",cat:"ucas",cf:"idea",t:"Long-list 8–10 courses and read each course page's French-bac line",x:"Use the Universities tab as a starting point. Note required spécialités, marks out of 20, admissions test and interview."},
 {id:"a21",d:"2027-05-12",ap:"~12 May 2027",cat:"ucas",cf:"projected",t:"UCAS Hub opens for 2028 entry: create his account and link it to the Lycée",x:"Last cycle opened 12 May 2026. He registers in the UCAS Hub with a personal email (not a school one), chooses the 2028 entry cycle, then enters the Lycée's UCAS 'buzzword' so the school can add its reference and predicted grades. Ask the advisers for the buzzword. He can draft everything from now, but can't submit until September. The fee was £34.50 for up to five choices last cycle.",u:U_UCAS},
 {id:"a22",d:"2027-06-01",ap:"~1 June 2027",cat:"tests",cf:"projected",t:"UAT-UK accounts open (ESAT / TMUA)",x:"Create the account and request any access arrangements or bursary early; reviews take up to 10 working days.",u:U_UAT},
 {id:"a23",d:"2027-06-15",cat:"school",cf:"confirmed",t:"Bac: épreuve anticipée de français (écrit)",x:"Tuesday 15 June 2027, 8h–12h (metropolitan France timetable). Lycées abroad follow the AEFE calendar, which can differ: confirm with the Lycée.",u:U_BAC},
 {id:"a24",d:"2027-06-20",ap:"Mid–late June 2027",cat:"visits",cf:"projected",t:"June open days: Warwick, Edinburgh, Durham",x:"Last year: Warwick 20 & 27 June, Edinburgh 22 June, Durham 26 June. Clashes with the bac épreuves anticipées, so pick carefully.",u:U_OD},
 {id:"a25",d:"2027-06-21",cat:"school",cf:"confirmed",t:"Bac: épreuve anticipée de mathématiques",x:"Monday 21 June 2027, 8h–10h, no calculator; counts towards the 2028 bac. The oral de français runs 21 June – 9 July depending on the académie.",u:U_BAC},
 {id:"a26",d:"2027-06-24",ap:"Late June 2027",cat:"visits",cf:"projected",t:"Imperial open days",x:"Last year: 24–25 June, plus a September day. Book departmental sessions; they fill up. A short walk from the Lycée.",u:"https://www.imperial.ac.uk/study/open-days/"},
 {id:"a27",d:"2027-06-26",ap:"Late June 2027",cat:"visits",cf:"projected",t:"UCL open days",x:"Last year: 26–27 June.",u:U_OD},

function setStatus(m){ if(m!=null) statusMsg=m; var el=document.getElementById("status"); if(el) el.textContent=statusMsg; }

function persist(){
  if(mode==="local"||readOnly){ lsSet(); setStatus("Saved on this device"); return; }
  if(mode==="pending"){ lsSet(); pendingDirty=true; setStatus("Saving…"); return; }
  scheduleSave();
}
function scheduleSave(){
  clearTimeout(saveTimer); setStatus("Unsaved changes…");
  saveTimer=setTimeout(doSave, 2500);
}
function doSave(){
  if(!art) return;
  setStatus("Saving…");
  try{ sessionStorage.setItem("ukuni-view", JSON.stringify({tab:view.tab,hideDone:view.hideDone,cats:view.cats,y:window.scrollY})); }catch(e){}
  art.publish(buildDoc()).then(function(){ setStatus("Saved"); }).catch(function(e){
    var c=e&&e.code;
    if(c==="conflict"){ setStatus("Updated elsewhere, reloading"); return; }
    if(["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"].indexOf(c)>=0){
      readOnly=true; lsSet(); setStatus("Read-only view: your ticks are kept on this device only"); return; }
    if(c==="rate_limited"){ setStatus("Saving paused for a moment"); saveTimer=setTimeout(doSave,15000); return; }
    if(c==="upstream_error" && !retried){ retried=true; setTimeout(doSave, 2000+Math.random()*2000); return; }
    lsSet(); setStatus("Couldn't save to the page; kept on this device");
  });
}

})();

      '<button class="linkbtn" data-note="'+i.id+'">'+(note?"Edit note":"Add note")+'</button>'+
      (i.mine?'<button class="linkbtn" data-del="'+i.id+'">Remove</button>':'')+
      '</div><div class="note" id="n-'+i.id+'" hidden><input type="text" maxlength="400" aria-label="Note for '+esc(i.t)+'" value="'+esc(note)+'" data-noteinput="'+i.id+'"><button class="btn" data-notesave="'+i.id+'">Save note</button></div>'+
      '</div></li>';
  });
  h+='</ol>';
  h+='<div class="add"><h4>Add your own item</h4><form id="addForm">'+
     '<label>Date<input type="date" name="d" required min="2026-01-01" max="2029-12-31"></label>'+
     '<label>What<input type="text" name="t" required maxlength="140" placeholder="e.g. Physics mock interview with Mme X"></label>'+
     '<label>Type<select name="cat">'+Object.keys(CATS).map(function(k){return '<option value="'+k+'">'+CATS[k].n+'</option>';}).join("")+'</select></label>'+
     '<button class="btn" type="submit">Add item</button></form></div>';
  return h;
}

function unisHTML(){
  var h='<p class="intro">What each university asks of a <strong>French bac</strong> student, taken from its own pages where possible. Marks are out of 20 and are <strong>minimums</strong>: successful applicants usually sit above them. Requirements are reset every year, so re-check in spring 2027 for 2028 entry.</p>';
  UNIS.forEach(function(u){
    h+='<div class="block'+(u.warn?' warnblock':'')+'"><div class="mg">'+esc(u.k)+'</div><div class="bd"><h3>'+esc(u.n)+'</h3><dl>'+
      '<dt>Courses to look at</dt><dd>'+esc(u.c)+'</dd>'+
      '<dt>French bac</dt><dd>'+esc(u.b)+'</dd>'+
      '<dt>Admissions test</dt><dd>'+esc(u.t)+'</dd>'+
      '<dt>Process</dt><dd>'+esc(u.p)+'</dd>'+
      '<dt>Open days</dt><dd>'+esc(u.o)+'</dd>'+
      '</dl><p class="src"><a href="'+esc(u.u)+'" target="_blank" rel="noopener">Source page</a></p></div></div>';
  });
  return h;
}

function testsHTML(){
  var h='<p class="intro">Since the 2027-entry cycle Oxford has dropped its own tests (MAT, PAT) and joined Cambridge, Imperial, UCL, LSE, Warwick and Durham on the shared UAT-UK tests, sat on computer at Pearson VUE centres. For Oxford or Cambridge, the <strong>October</strong> sitting is the only one that counts.</p>';
  TESTS.forEach(function(t){
    h+='<div class="block"><div class="mg">'+esc(t.k)+'</div><div class="bd"><h3>'+esc(t.n)+'</h3><dl>'+
      '<dt>'+(t.k==="Practice"?"Where":"Used by")+'</dt><dd>'+esc(t.w)+'</dd>'+
      '<dt>'+(t.k==="Practice"?"Tip":"Format")+'</dt><dd>'+esc(t.f)+'</dd>'+
      (t.s?'<dt>When and cost</dt><dd>'+esc(t.s)+'</dd>':'')+
      '</dl>'+(t.k==="ESAT"||t.k==="TMUA"?'<p class="src"><a href="'+U_UAT+'" target="_blank" rel="noopener">UAT-UK key dates</a></p>':'')+'</div></div>';
  });
  return h;
}

function projectsHTML(){
  var h='<div class="block"><div class="mg">The short answer</div><div class="bd"><h3>No project has to be submitted</h3>'+
    '<p>UK science applications don\'t ask for a portfolio or a formal project. What they do reward is evidence of curiosity beyond the bac: it fills two of the three personal-statement questions, and Oxford, Cambridge and Imperial interviewers will happily ask about it.</p>'+
    '<p>One well-documented project beats five name-drops. The best ones start from a question, involve some maths or code he wrote himself, and end with something he can explain at a whiteboard, including what went wrong. A single project can also feed the grand oral in Terminale.</p>'+
    '<p>Competitions (UKMT, BPhO, the Informatics Olympiad, the Olympiades de mathématiques) and reading count too. Online courses can be mentioned in the statement but aren\'t qualifications.</p>'+
    '</div></div>';
  h+='<div class="block"><div class="mg">Ideas</div><div class="bd"><h3>Starter topics (suggestions, not requirements)</h3><div class="ideas">';
  IDEAS.forEach(function(g){
    h+='<div><h4 style="color:var(--margin)">'+esc(g.s)+'</h4>';
    g.items.forEach(function(it){ h+='<h4>'+esc(it[0])+'</h4><p>'+esc(it[1])+'</p><p class="shows">'+esc(it[2])+'</p>'; });
    h+='</div>';
  });
  h+='</div></div></div>';
  h+='<div class="block"><div class="mg">Timing</div><div class="bd"><h3>When to do it</h3><ul>'+
    '<li>Winter 2026–27: try two or three small ideas, keep the one he can\'t stop thinking about.</li>'+
    '<li>Spring 2027: go deeper; keep a short write-up with graphs and code.</li>'+
    '<li>Summer 2027: finish it before the personal statement is drafted.</li>'+
    '<li>Autumn 2027: be ready to explain it, and its weak spots, at interview.</li></ul></div></div>';
  return h;
}

function decisionsHTML(){
  var h='<p class="intro">The choices that shape everything else, roughly in the order they fall due.</p>';
  DECISIONS.forEach(function(d,ix){
    h+='<div class="block"><div class="mg">'+(ix+1)+'</div><div class="bd"><h3>'+esc(d[0])+'</h3><p>'+esc(d[1])+'</p></div></div>';
  });
  return h;
}

function footerHTML(){
  return '<footer><div class="wrap"><div class="sheet">'+
    '<p><strong>How dates are labelled.</strong> "Confirmed" comes from an official page. "Published (re-check)" comes from a published list that isn\'t the university\'s own page. "Projected" copies last cycle\'s pattern: official 2028-entry dates for UCAS and UAT-UK usually appear in spring and summer 2027, so update these then.</p>'+
    '<p>Bac dates shown are the metropolitan France timetable; the Lycée follows the AEFE calendar for schools abroad, which can differ. Compiled 12 October 2026.</p>'+
    '</div></div></footer>';
}

function render(){
  var items=allItems();
  var app=document.getElementById("app");
  app.innerHTML = heroHTML(items)+tabsHTML()+
    '<main><div class="wrap"><div class="sheet">'+
    '<section class="panel" id="p-timeline" role="tabpanel" '+(view.tab==="timeline"?"":"hidden")+'>'+timelineHTML(items)+'</section>'+
    '<section class="panel" id="p-unis" role="tabpanel" '+(view.tab==="unis"?"":"hidden")+'>'+unisHTML()+'</section>'+
    '<section class="panel" id="p-tests" role="tabpanel" '+(view.tab==="tests"?"":"hidden")+'>'+testsHTML()+'</section>'+
    '<section class="panel" id="p-projects" role="tabpanel" '+(view.tab==="projects"?"":"hidden")+'>'+projectsHTML()+'</section>'+
    '<section class="panel" id="p-decisions" role="tabpanel" '+(view.tab==="decisions"?"":"hidden")+'>'+decisionsHTML()+'</section>'+
    '</div></div></main>'+footerHTML();
}

document.addEventListener("click", function(e){
  var t=e.target.closest("[data-tab],[data-cat],[data-note],[data-notesave],[data-del],[data-backup],[data-restore]");
  if(!t) return;
  if(t.dataset.backup){ var js=JSON.stringify(state); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(js).then(function(){ setStatus("Backup copied: paste it somewhere safe, e.g. Notes"); }).catch(function(){ window.prompt("Copy this backup text:", js); }); } else { window.prompt("Copy this backup text:", js); } return; }
  if(t.dataset.restore){ var txt=window.prompt("Paste a backup to restore (this replaces current ticks and notes):"); if(!txt) return; try{ var o=JSON.parse(txt); state.done=o.done||{}; state.notes=o.notes||{}; state.custom=o.custom||[]; render(); persist(); setStatus("Backup restored"); }catch(err){ setStatus("That backup text could not be read"); } return; }
  if(t.dataset.tab){ view.tab=t.dataset.tab; var y=window.scrollY; render(); var hero=document.querySelector(".hero"); window.scrollTo(0, Math.min(y, hero?hero.offsetHeight:0)); return; }
  if(t.dataset.cat){ view.cats[t.dataset.cat]= (view.cats[t.dataset.cat]===false); var y2=window.scrollY; render(); window.scrollTo(0,y2); return; }
  if(t.dataset.note){ var box=document.getElementById("n-"+t.dataset.note); if(box){ box.hidden=!box.hidden; if(!box.hidden){ var inp=box.querySelector("input"); if(inp) inp.focus(); } } return; }
  if(t.dataset.notesave){ saveNote(t.dataset.notesave); return; }
  if(t.dataset.del){ var id=t.dataset.del; state.custom=state.custom.filter(function(c){return c.id!==id;}); delete state.done[id]; delete state.notes[id]; var y3=window.scrollY; render(); window.scrollTo(0,y3); persist(); return; }
});
function saveNote(id){
  var inp=document.querySelector('[data-noteinput="'+id+'"]'); if(!inp) return;
  var v=inp.value.trim(); if(v) state.notes[id]=v; else delete state.notes[id];
  var y=window.scrollY; render(); window.scrollTo(0,y); persist();
}
document.addEventListener("keydown", function(e){
  if(e.key==="Enter" && e.target && e.target.dataset && e.target.dataset.noteinput){ e.preventDefault(); saveNote(e.target.dataset.noteinput); }
});
document.addEventListener("change", function(e){
  var t=e.target;
  if(t.dataset && t.dataset.done){ var id=t.dataset.done; if(t.checked) state.done[id]=true; else delete state.done[id]; var y=window.scrollY; render(); window.scrollTo(0,y); persist(); return; }
  if(t.id==="hideDone"){ view.hideDone=t.checked; var y2=window.scrollY; render(); window.scrollTo(0,y2); }
});
document.addEventListener("submit", function(e){
  if(e.target.id!=="addForm") return; e.preventDefault();
  var f=e.target, d=f.d.value, tt=f.t.value.trim(), c=f.cat.value;
  if(!d||!tt) return;
  state.custom.push({id:"c"+Date.now().toString(36), d:d, t:tt, cat:CATS[c]?c:"admin"});
  render(); persist();
  var el=document.getElementById("addForm"); if(el) el.scrollIntoView({block:"center"});
});

render();
if(view._y){ setTimeout(function(){ window.scrollTo(0, view._y); }, 30); }
})();
</script>
</body>
</html>
